# Tag pushes of v* publish GitHub Release archives. workflow_dispatch builds
# the same artifacts and does not create a release. Nothing here publishes on
# pull requests. Targets are native runners from the GitHub-hosted runners
# reference (checked 2026-09-21); cross toolchains are not required.
# Each native job packages the archive, then smoke-tests that archive with
# scripts/release_smoke.py before upload. Windows is supported through WSL2
# with the Linux archive; the wsl-install job runs install.ps1 against that
# archive on a Windows runner and then the same smoke harness inside WSL.
# That job does not claim a native Windows binary.
name: Release
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            ext: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            base=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
            ver="${base}-g${GITHUB_SHA:0:7}"
          fi
          case "$ver" in
            *[!0-9A-Za-z._+-]*|"")
              echo "invalid version: $ver" >&2
              exit 1
              ;;
          esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Test
        shell: bash
        run: cargo test --locked --all-targets --target "${{ matrix.target }}"
      - name: Build
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.ext }}
          COMMIT: ${{ github.sha }}
        run: scripts/package-release.sh
      - name: Smoke packaged archive
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          archive="dist/checkweave-${VERSION}-${TARGET}.${ARCHIVE_EXT}"
          test -f "$archive"
          sum=$(python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$archive")
          python3 scripts/release_smoke.py --archive "$archive" --checksum "$sum"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/checkweave-*
          if-no-files-found: error

  wsl-install:
    name: Windows install through WSL
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
      - name: install.ps1 into WSL, then smoke init and upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-WslScript([string]$Body) {
            $Body = $Body -replace "`r", ""
            $file = Join-Path $PWD "wsl-step.sh"
            [IO.File]::WriteAllText($file, $Body)
            $path = (wsl.exe -e wslpath -a -u "$file").Trim()
            $lines = & wsl.exe -e sh $path
            if ($LASTEXITCODE -ne 0) { throw "WSL command failed ($LASTEXITCODE)`n$($lines | Out-String)" }
            Write-Output (($lines | Out-String).Trim())
          }
          $archive = Get-ChildItem dist -Filter "checkweave-*-x86_64-unknown-linux-gnu.tar.gz" | Select-Object -First 1
          if (-not $archive) { throw "Linux archive artifact is missing" }
          $sum = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
          .\scripts\install.ps1 -Archive $archive.FullName -Checksum $sum
          .\scripts\install.ps1 -Archive $archive.FullName -Checksum $sum
          $before = Invoke-WslScript @'
          set -eu
          sha256sum "$HOME/.local/bin/checkweave" | awk '{print $1}'
          '@
          if ($before -notmatch '^[0-9a-f]{64}$') { throw "could not hash the WSL binary: $before" }
          $bad = "f" * 64
          if ($sum -eq $bad) { $bad = "e" * 64 }
          $rejected = $false
          try {
            .\scripts\install.ps1 -Archive $archive.FullName -Checksum $bad
          } catch {
            $rejected = $true
          }
          if (-not $rejected) { throw "wrong checksum was accepted" }
          $afterBad = Invoke-WslScript @'
          set -eu
          sha256sum "$HOME/.local/bin/checkweave" | awk '{print $1}'
          '@
          if ($afterBad -ne $before) { throw "wrong checksum changed the WSL binary" }
          Invoke-WslScript @'
          set -eu
          printf '%s\n' '#!/bin/sh' 'echo stub' > "$HOME/.local/bin/checkweave"
          chmod 755 "$HOME/.local/bin/checkweave"
          grep -q stub "$HOME/.local/bin/checkweave"
          '@
          .\scripts\install.ps1 -Archive $archive.FullName -Checksum $sum
          $upgraded = Invoke-WslScript @'
          set -eu
          sha256sum "$HOME/.local/bin/checkweave" | awk '{print $1}'
          '@
          if ($upgraded -ne $before) { throw "install.ps1 did not replace the stub binary" }
          $archiveWsl = (wsl.exe -e wslpath -a -u $archive.FullName).Trim()
          $scriptWsl = (wsl.exe -e wslpath -a -u "$PWD\scripts\release_smoke.py").Trim()
          Invoke-WslScript @"
          set -eu
          python3 "$scriptWsl" --archive "$archiveWsl" --checksum "$sum" --skip-installer --skip-uninstall --bin "`$HOME/.local/bin/checkweave"
          "@
          .\scripts\uninstall.ps1
          .\scripts\uninstall.ps1

  publish:
    name: Publish GitHub Release
    needs: [build, wsl-install]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          for triple in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            aarch64-apple-darwin \
            x86_64-apple-darwin
          do
            test -f "dist/checkweave-${ver}-${triple}.tar.gz"
          done
          cp scripts/install.sh scripts/uninstall.sh scripts/install.ps1 scripts/uninstall.ps1 dist/
          (
            cd dist
            sha256sum \
              checkweave-* \
              install.sh uninstall.sh install.ps1 uninstall.ps1 \
              | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/checkweave-*
            dist/install.sh
            dist/uninstall.sh
            dist/install.ps1
            dist/uninstall.ps1
            dist/SHA256SUMS
          body: |
            Native archives for Linux and macOS. Windows runs the Linux archive through WSL2: run install.ps1 from PowerShell. Each archive contains the checkweave binary, LICENSE, README, CONTRIBUTING, the Markdown guides under docs, and runnable recipes.
            SHA256SUMS lists the archives and the install scripts.
            Assets were produced by `cargo test --locked --all-targets` and `cargo build --locked --release` on the runners in `.github/workflows/release.yml`.
            Review `install.sh` or `install.ps1` before running either one. See `docs/platforms.md` for which targets a given release actually built.
            The binary includes check, compare, replay, semantic, trace, model setup/evaluate, run handles, and deinit. The Python trace helper is embedded and written to the user cache; a source checkout is not required. The local default does not fall back to a hosted provider. A local Q4 sample is not the BF16 JevBench score and is not a release qualification.
