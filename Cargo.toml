[package]
name = "checkweave"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Incremental local checks and execution evidence for agents"
license = "MIT"
repository = "https://github.com/ruizmr/checkweave"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
globset = "0.4"
ignore = "0.4"
notify = "8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.4", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
filetime = "0.2"

[profile.release]
lto = "thin"
strip = true
